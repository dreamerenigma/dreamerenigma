name: Update GitHub Profile Stats

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate GitHub Stats
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: username=dreamerenigma&show_icons=true&theme=radical&hide_border=true
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Streak Stats
        uses: DenverCoder1/github-readme-streak-stats@v1
        with:
          options: user=dreamerenigma&theme=radical&hide_border=true
          path: profile/streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Generate Repository Pin
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=dreamerenigma&repo=dreamerenigma&theme=radical&show_owner=true
          path: profile/pin-dreamerenigma.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create profile directory
        run: mkdir -p profile

      - name: Generate Sonora Card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=dreamerenigma&repo=sonora&theme=radical&show_owner=true
          path: profile/project-sonora.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate Chatify Flutter Card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=dreamerenigma&repo=chatify-flutter&theme=radical&show_owner=true
          path: profile/project-chatify-flutter.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate Notes Flutter Card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=dreamerenigma&repo=notes-flutter&theme=radical&show_owner=true
          path: profile/project-notes-flutter.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate Reader Book Card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=dreamerenigma&repo=reader-book&theme=radical&show_owner=true
          path: profile/project-reader-book.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Verify generated cards
        run: |
          echo "Generated files:"
          ls -lah profile/

          test -s profile/project-ue4-shooter.svg
          test -s profile/project-chatify-ai-api.svg

      - name: Commit generated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "chore: update GitHub profile stats" || exit 0
          git push
